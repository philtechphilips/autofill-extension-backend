name: Security Scanning

# Trivy security scan. Prints findings as a table in the runner logs and
# FAILS the build when secrets or CRITICAL/HIGH vulnerabilities are found.

on:
  push:
    branches: [dev, master, main]
  pull_request:
    branches: [dev, master, main]
  schedule:
    - cron: "0 6 * * 1" # weekly, Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: secret
          scan-ref: .
          format: table
          skip-files: "**/.env,**/.env.*"
          exit-code: "1" # fail on any secret found
        env:
          TRIVY_SKIP_DIRS: node_modules,build,dist

      - name: Trivy vulnerability & misconfig scan
        if: always() # still run/report even if the secret scan failed
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1" # fail on CRITICAL/HIGH findings
        env:
          TRIVY_SKIP_DIRS: node_modules,build,dist
